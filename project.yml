name: SideRelay
options:
  bundleIdPrefix: io.github.corbendallas111
  deploymentTarget:
    iOS: "18.0"
settings:
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEBUG"
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: targeted
    CODE_SIGNING_ALLOWED: NO
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  SideRelay:
    type: application
    platform: iOS
    sources:
      - path: app
        excludes: [SideRelay.h]
    info:
      path: build/Info.plist
      properties:
        CFBundleDisplayName: SideRelay
        CFBundleShortVersionString: "0.3.1"
        CFBundleVersion: "4"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSLocalNetworkUsageDescription: "SideRelay pairs with your target device and transfers the IPA over your local Wi-Fi network."
        NSBonjourServices: ["_remotepairing-pairable-host._tcp", "_remotepairing._tcp"]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.corbendallas111.SideRelay
        SWIFT_OBJC_BRIDGING_HEADER: app/SideRelay.h
        LIBRARY_SEARCH_PATHS: ["$(inherited)", "$(SRCROOT)/core/target/aarch64-apple-ios/release"]
        OTHER_LDFLAGS: ["$(inherited)", "-lsiderelay_core", "-lc++", "-lz", "-liconv", "-lresolv", "-framework", Security, "-framework", SystemConfiguration]
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
schemes:
  SideRelay:
    build:
      targets:
        SideRelay: all
    run:
      config: Debug
    archive:
      config: Release
