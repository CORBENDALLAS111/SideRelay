[package]
name = "siderelay-core"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
idevice = { version = "=0.1.68", default-features = false, features = ["ring", "tcp", "afc", "installation_proxy", "remote_pairing", "rsd", "tunnel_tcp_stack"] }
isideload = { version = "=0.5.0", default-features = false, features = ["install", "tokio-mt"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
zeroize = "1"
rootcause = "0.12"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
zip = { version = "8.3", default-features = false, features = ["deflate"] }
plist = "1.8"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = "debuginfo"
