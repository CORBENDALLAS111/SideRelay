name: Build SideRelay IPA
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Select Liquid Glass SDK
        run: sudo xcode-select -s /Applications/Xcode_26.3.app
      - name: Install Rust and XcodeGen
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup target add aarch64-apple-ios
          brew install xcodegen
          xcodebuild -version
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: Test core and validate formatting
        run: |
          cargo fmt --manifest-path core/Cargo.toml --check
          cargo test --manifest-path core/Cargo.toml --locked
          cargo test --manifest-path core/Cargo.toml --locked -p isideload siderelay_resync_regression
      - name: Compile native core for iPhone
        run: |
          export IPHONEOS_DEPLOYMENT_TARGET=18.0
          export SDKROOT="$(xcrun --sdk iphoneos --show-sdk-path)"
          cargo build --manifest-path core/Cargo.toml --locked --release --target aarch64-apple-ios
      - name: Build application
        run: |
          python3 scripts/licenses.py
          xcodegen generate
          xcodebuild -project SideRelay.xcodeproj -scheme SideRelay -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO build
      - name: Package unsigned IPA for SideStore
        run: |
          python3 scripts/package.py
          python3 scripts/source_bundle.py
          shasum -a 256 build/SideRelay.ipa > build/SideRelay.ipa.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: SideRelay-unsigned-IPA
          path: |
            build/SideRelay.ipa
            build/SideRelay.ipa.sha256
            build/SideRelay-source.zip
          retention-days: 14
      - name: Render interface in iOS Simulator
        run: python3 scripts/ui_preview.py
      - uses: actions/upload-artifact@v4
        with:
          name: SideRelay-UI-previews
          path: build/UI/*.png
          retention-days: 14
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/SideRelay.ipa build/SideRelay.ipa.sha256 build/SideRelay-source.zip --title "SideRelay $GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md --prerelease
